<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenogramIA</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body style="text-align: center; align-content: center">
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
    <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
    <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
            stroke-dasharray="90 125">
        <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                          repeatCount="indefinite"/>
    </circle>
</svg>
<script type="module">
    // Importar las funciones necesarias del CDN oficial
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import * as auth from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import * as firestore from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Tu configuración de Firebase (obtenida de la consola de Firebase)
    const firebaseConfig = {
        apiKey: "AIzaSyDGR_1PCQ9-9ABjJJBqyzHG9XtXZw4GP3o",
        authDomain: "genogramia.firebaseapp.com",
        projectId: "genogramia",
        storageBucket: "genogramia.firebasestorage.app",
        messagingSenderId: "870268550076",
        appId: "1:870268550076:web:3adaa56499c727597549b9"
    };
    const app = initializeApp(firebaseConfig);

    // Auth setup
    window.firebaseAuth = auth.getAuth(app);
    window.firebaseAuthModule = auth;

    // Firestore setup with helper functions
    const db = firestore.getFirestore(app);
    window.firebaseFirestore = db;
    window.firebaseFirestoreModule = {
        ...firestore,
        saveTree: async (db, userId, treeId, json) => {
            const docRef = firestore.doc(db, "users", userId, "trees", treeId);
            return await firestore.setDoc(docRef, JSON.parse(json));
        },
        getTree: async (db, userId, treeId) => {
            const docRef = firestore.doc(db, "users", userId, "trees", treeId);
            const docSnap = await firestore.getDoc(docRef);
            return docSnap.exists() ? JSON.stringify(docSnap.data()) : null;
        },
        getTrees: async (db, userId) => {
            const q = firestore.query(firestore.collection(db, "users", userId, "trees"));
            const querySnapshot = await firestore.getDocs(q);
            const trees = [];
            querySnapshot.forEach((doc) => {
                trees.push(JSON.stringify(doc.data()));
            });
            return JSON.stringify(trees);
        },
        deleteTree: async (db, userId, treeId) => {
            const docRef = firestore.doc(db, "users", userId, "trees", treeId);
            return await firestore.deleteDoc(docRef);
        }
    };
</script>
<script type="application/javascript" src="composeApp.js" defer></script>
</body>
</html>
