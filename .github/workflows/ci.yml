name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'diseases/**'

jobs:

  static-analysis:
    name: Static Analysis (Spotless & Detekt)
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Spotless Check
        run: ./gradlew spotlessCheck

      - name: Run Detekt
        run: ./gradlew detekt

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :composeApp:assembleDebug

  deploy-android:
    name: Deploy Android
    runs-on: ubuntu-latest
    needs: build-android
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_ENCODED: ${{ secrets.KEYSTORE_ENCODED }}
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
        run: echo $KEYSTORE_ENCODED | base64 -d > $KEYSTORE_PATH

      - name: Load Keystore properties
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "keystore.storePassword=$KEY_STORE_PASSWORD" >> keystore.properties
          echo "keystore.keyAlias=$ALIAS" >> keystore.properties
          echo "keystore.keyPassword=$KEY_PASSWORD" >> keystore.properties

      - name: Create service_account.json
        run: echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Assemble release bundle
        run: ./gradlew :composeApp:bundleRelease

      - name: Deploy to Play Store (Internal Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service_account.json
          packageName: dev.saragones3.genogramia
          releaseFiles: composeApp/build/outputs/bundle/release/composeApp-release.aab
          track: internal
          whatsNewDirectory: whatsnew/

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :composeApp:wasmJsBrowserDistribution

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-distribution
          path: composeApp/build/dist/wasmJs/productionExecutable

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: build-web
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-distribution
          path: composeApp/build/dist/wasmJs/productionExecutable

      - name: Upload diseases
        run: |
          mkdir -p composeApp/build/dist/wasmJs/productionExecutable/api
          cp -r diseases/* composeApp/build/dist/wasmJs/productionExecutable/api/

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GENOGRAMIA }}
          channelId: live
          target: web
          projectId: genogramia